<div class="w-full h-full flex flex-col gap-3">
  <div class="card p-3 flex flex-row items-center justify-between">
    <div></div>
    <div>
      <p-button
        type="submit"
        label="New Task"
        icon="pi pi-plus"
        outlined="true"
        (onClick)="newTask()"
      />
    </div>
  </div>
  <div class="h-full flex flex-row gap-3 select-none">
    @for (boardItem of boardItems; track boardItem) {
    <!-- <p-panel [header]="boardItem.columnName" class="w-96 h-full"> -->
    <div
      class="card bg-base-300 w-96 h-full flex flex-col gap-3 overflow-y-auto"
    >
      <div class="card-body">
        <h2 class="card-title">{{ boardItem.columnName }}</h2>
        <div
          cdkDropList
          [id]="boardItem.columnName"
          [cdkDropListData]="boardItem.items"
          [ngClass]="
            boardItem.items.length > 0
              ? 'min-h-96 h-full overflow-hidden flex flex-col gap-3 '
              : 'h-96 border-2 border-dashed border-primary rounded-lg '
          "
          [cdkDropListConnectedTo]="getConnnectedColumns(boardItem.columnName)"
          (cdkDropListDropped)="drop($event)"
        >
          @for (item of boardItem.items; track item) {
          <div
            cdkDrag
            class="card h-auto bg-base-100 min-h-32 cursor-pointer"
            (click)="itemClick()"
          >
            <div class="card">
              <div class="card-body">
                <div class="card-title">
                  {{ item.title }}
                </div>

                <div class="flex flex-col gap-3">
                  <div class="flex flex-row flex-wrap gap-3">
                    <p-tag
                      severity="secondary"
                      [value]="'Priority: ' + item.priority"
                    />
                    <p-tag
                      severity="success"
                      [value]="'Effor: ' + item.effort"
                    />
                  </div>
                  <div class="tasks">0 of 3 subtasks</div>
                </div>
              </div>
            </div>
          </div>
          <!-- <p-panel
            class="cursor-pointer h-auto"
            [header]="item.title"
            cdkDrag
            (click)="itemClick()"
          >
          </p-panel> -->
          }
        </div>
      </div>
    </div>
    <!-- </p-panel> -->
    }
  </div>
</div>
